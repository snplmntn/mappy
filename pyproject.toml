[project]
name = "mappy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic==2.11.7",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "onnx>=1.16",
  "tokenizers>=0.19",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "server" }
packages = ["mappy"]

[tool.pytest.ini_options]
pythonpath = ["server", "server/tests"]
testpaths = ["server/tests"]
