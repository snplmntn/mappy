<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2A30">
  <title>Mappy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="bar">
    <button id="here" class="here" type="button" aria-haspopup="dialog">
      <span class="here-dot" aria-hidden="true"></span>
      <span id="hereLabel" class="here-label">Saan ka?</span>
    </button>
    <button id="mapBtn" class="bar-btn" type="button">Mapa</button>
    <span id="aiBadge" class="ai-badge" title="Tumatakbo sa local na AI, walang internet">
      <span class="ai-dot" aria-hidden="true"></span>Offline AI
    </span>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div class="dock">
    <div id="chips" class="chips" role="list"></div>
    <form id="composer" class="composer" autocomplete="off">
      <input id="input" class="input" name="message" maxlength="500"
             placeholder="Ano ang gagawin mo sa mall?" aria-label="Message">
      <button id="send" class="send" type="submit">Send</button>
    </form>
  </div>

  <section id="mapview" class="mapview" hidden aria-label="Map">
    <div class="map-top">
      <button id="mapBack" class="bar-btn" type="button">Back</button>
      <div class="map-title">
        <div id="mapStep" class="map-step"></div>
        <div id="mapInstruction" class="map-instruction"></div>
      </div>
    </div>
    <div class="map-body">
      <svg id="mapSvg" class="map-svg" role="img" aria-label="Floor map"></svg>
      <nav id="floorStrip" class="floor-strip" aria-label="Floors"></nav>
    </div>
    <div id="mapCard" class="map-card"></div>
  </section>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

  <p class="note" id="dataNote"></p>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
