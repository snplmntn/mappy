<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1f21" media="(prefers-color-scheme: dark)">
  <title>Mappy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <section id="chatView" class="view">
    <header class="topbar">
      <button id="placePill" class="place-pill" type="button" aria-haspopup="dialog">
        <span class="place-dot" aria-hidden="true"></span>
        <span id="placeText" class="place-text">Set your location</span>
      </button>
      <button id="mapBtn" class="icon-btn" type="button" aria-label="Open map"></button>
      <button id="newBtn" class="icon-btn" type="button" aria-label="New trip"></button>
    </header>
    <main id="thread" class="thread"></main>
    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="500" placeholder="Ask Mappy" aria-label="Message"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send" disabled></button>
      </form>
      <p id="fineprint" class="fineprint"></p>
    </footer>
  </section>

  <section id="navView" class="view nav" hidden aria-label="Map">
    <svg id="mapSvg" class="map-svg" role="img" aria-label="Floor map"></svg>
    <div id="navTop" class="nav-top glass"></div>
    <nav id="floors" class="floors glass" aria-label="Floors"></nav>
    <div id="navSheet" class="nav-sheet glass"></div>
  </section>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
