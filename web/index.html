<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f7f4e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)">
  <title>Mappy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/neobrutal.css">
</head>
<body>
  <section id="chatView" class="view">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Mappy home"><span class="brand-symbol" aria-hidden="true">m</span><span>mappy<span class="brand-period">.</span></span></a>
      <span class="header-divider" aria-hidden="true"></span>
      <button id="placePill" class="place-pill" type="button" aria-haspopup="dialog">
        <span id="locationIcon" class="location-icon" aria-hidden="true"></span>
        <span id="placeText" class="place-text">Set your location</span>
      </button>
      <button id="mapBtn" class="icon-btn" type="button" aria-label="Open map"></button>
      <button id="newBtn" class="icon-btn" type="button" aria-label="New trip"></button>
    </header>
    <main id="thread" class="thread" aria-label="Trip assistant"></main>
    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off" onsubmit="event.preventDefault()">
        <span id="composerIcon" class="composer-icon" aria-hidden="true"></span>
        <textarea id="input" rows="1" maxlength="500" placeholder="What’s on your list today?" aria-label="Message Mappy"></textarea>
        <button id="mic" class="mic" type="button" aria-label="Speak"></button>
        <button id="send" class="send" type="submit" aria-label="Send" disabled></button>
      </form>
      <p class="composer-hint">Ask in English or Taglish. We'll plan the way.</p>
      <details class="map-disclosure"><summary>About this map</summary><p id="fineprint" class="fineprint"></p></details>
    </footer>
  </section>

  <section id="navView" class="view nav" hidden aria-label="Map">
    <svg id="mapSvg" class="map-svg" role="img" aria-label="Floor map"></svg>
    <div id="navTop" class="nav-top glass"></div>
    <nav id="floors" class="floors glass" aria-label="Floors"></nav>
    <div id="navSheet" class="nav-sheet glass"></div>
  </section>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
  <script>
    (function () {
      function report(message, stack) {
        try {
          var body = JSON.stringify({ message: String(message).slice(0, 2000), stack: String(stack || "").slice(0, 8000), ua: navigator.userAgent });
          if (navigator.sendBeacon) navigator.sendBeacon("/api/client-error", new Blob([body], { type: "application/json" }));
        } catch (e) { /* reporting must never throw */ }
        var t = document.getElementById("thread");
        if (t && !t.dataset.ok) {
          t.innerHTML = '<div class="empty"><h1>Mappy did not load</h1><p>Pull down to refresh the page.</p><p class="fineprint"></p></div>';
          t.querySelector(".fineprint").textContent = String(message);
        }
      }
      window.addEventListener("error", function (e) { report(e.message, e.error && e.error.stack); });
      window.addEventListener("unhandledrejection", function (e) { report(e.reason, e.reason && e.reason.stack); });
    })();
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
